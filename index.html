<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITOUBIA - Online Bookstore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="">
            KITOUBIA
        </a>
        <nav>
            <a href="#books">Books</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Find your next favorite book</h1>
        <p class="subtitle">Click on a book to order it.</p>

        <div class="books" id="books">
            <a class="card" href="book.html?id=1">
                <img src="images/1div.png" alt="Cover of A Second Match">
                <h2>A Second Match</h2>
                <p>by Eleanor Vance</p>
                <p class="price">25 DT</p>
            </a>

            <a class="card" href="book.html?id=2">
                <img src="images/2div.png" alt="Cover of The Trumpet of the Swan">
                <h2>The Trumpet of the Swan</h2>
                <p>by E. B. White</p>
                <p class="price">30 DT</p>
            </a>

            <a class="card" href="book.html?id=3">
                <img src="images/3div.png" alt="Cover of My 60 Memorable Games">
                <h2>My 60 Memorable Games</h2>
                <p>by Bobby Fischer</p>
                <p class="price">35 DT</p>
            </a>
        </div>
    </main>

    <footer id="contact">
        <p>KITOUBIA - contact@kitoubia.tn - +216 71 000 000</p>
    </footer>
</body>
</html>
